name: Validate

# Runs on the GitHub mirror to keep the HACS listing healthy: HACS structural
# checks + Home Assistant hassfest manifest validation.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` requires the domain to be registered in home-assistant/brands,
          # which only applies to integrations submitted to the HACS default store.
          # This one is installed as a custom repository, so the check never passes
          # and carries no signal. Everything else (structure, hacs.json, repo
          # metadata) is still enforced.
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
